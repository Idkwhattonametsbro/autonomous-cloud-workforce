<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Cloud Workforce</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#06060b;color:#e8e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center}
        body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 30%,rgba(79,143,255,.08),transparent),radial-gradient(ellipse 40% 40% at 80% 70%,rgba(139,92,246,.06),transparent);pointer-events:none}
        .card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:40px;width:100%;max-width:380px;backdrop-filter:blur(20px);position:relative;z-index:1}
        h1{font-size:22px;font-weight:700;margin-bottom:6px;text-align:center}
        p{font-size:13px;color:#888;text-align:center;margin-bottom:24px}
        input{width:100%;padding:12px 16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;color:#e8e8f0;font-size:14px;outline:none;margin-bottom:16px}
        input:focus{border-color:#4f8fff}
        button{width:100%;padding:12px;background:linear-gradient(135deg,#4f8fff,#8b5cf6);border:none;border-radius:10px;color:white;font-size:14px;font-weight:600;cursor:pointer;transition:transform .15s}
        button:hover{transform:translateY(-1px)}
        .error{color:#ef4444;font-size:12px;text-align:center;margin-bottom:12px}
    </style>
</head>
<body>
    <div class="card">
        <h1>🔐 Command Center</h1>
        <p>Enter the dashboard password to continue</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <input type="password" name="password" placeholder="Password" autofocus required>
            <button type="submit">Unlock Dashboard</button>
        </form>
    </div>
</body>
</html>
